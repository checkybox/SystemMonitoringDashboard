<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - System Monitoring Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preload" href="/assets/images/logo.png" as="image">
</head>
<body>

<!-- Collapsible navbar -->
<div class="container-fluid mb-4 bg-dark-custom">
    <nav class="navbar navbar-expand-md border-bottom">
        <div class="container-fluid">
            <img class="me-2" id="logo-animated" src="/assets/images/logo.png" width="48" height="48" alt="logo">
            <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#Navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="Navbar" class="navbar-collapse collapse">
                <ul class="navbar-nav fs-4">
                    <li class="nav-item ms-auto"><a class="nav-link fw-light" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link fw-light" href="/machines">Machines</a></li>
                    <li class="nav-item"><a class="nav-link fw-light" href="/settings">Settings</a></li>
                    <li class="nav-item"><a class="nav-link fw-light" href="/contact">Contact</a></li>
                    <li class="nav-item"><a class="nav-link fw-light" href="/about">About</a></li>
                    <li class="nav-item">
                        <button id="theme-toggle" class="btn btn-link nav-link fw-light" onclick="toggleTheme()" aria-label="Toggle theme">
                            <i class="bi bi-moon-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!-- Login Container -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock fs-1 text-primary"></i>
                        <h2 class="mt-3">Login</h2>
                        <p class="text-muted">Sign in to manage servers</p>
                    </div>

                    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                    <div id="success-message" class="alert alert-success d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3" id="loginButton">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Login
                        </button>

                        <div class="text-center">
                            <p class="mb-0">Don't have an account? <a href="/register">Register here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/theme.js"></script>
<script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');
    const loginButton = document.getElementById('loginButton');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous messages
        errorMessage.classList.add('d-none');
        successMessage.classList.add('d-none');

        // Disable button
        loginButton.disabled = true;
        loginButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Success
                successMessage.textContent = 'Login successful! Redirecting...';
                successMessage.classList.remove('d-none');

                // Redirect to home page after a short delay
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                // Error
                errorMessage.textContent = data.error || 'Login failed. Please try again.';
                errorMessage.classList.remove('d-none');

                // Re-enable button
                loginButton.disabled = false;
                loginButton.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
            }
        } catch (error) {
            console.error('Login error:', error);
            errorMessage.textContent = 'An error occurred. Please try again.';
            errorMessage.classList.remove('d-none');

            // Re-enable button
            loginButton.disabled = false;
            loginButton.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
        }
    });
</script>
</body>
</html>
