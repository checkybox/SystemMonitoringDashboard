<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - System Monitoring Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preload" href="/assets/images/logo.png" as="image">
</head>
<body>

<!-- Collapsible navbar -->
<div class="container-fluid mb-4 bg-dark-custom">
    <nav class="navbar navbar-expand-md border-bottom">
        <div class="container-fluid">
            <img class="me-2" id="logo-animated" src="/assets/images/logo.png" width="48" height="48" alt="logo">
            <a class="navbar-brand ms-2 fs-4 fw-light" href="/">System Monitoring Dashboard</a>
            <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#Navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="Navbar" class="navbar-collapse collapse">
                <ul class="navbar-nav ms-auto fs-4">
                    <li class="nav-item"><a class="nav-link fw-light" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link fw-light" href="/machines">Machines</a></li>
                    <li class="nav-item"><a class="nav-link fw-light" href="/settings">Settings</a></li>
                    <li class="nav-item"><a class="nav-link fw-light" href="/contact">Contact</a></li>
                    <li class="nav-item"><a class="nav-link fw-light" href="/about">About</a></li>
                    <li class="nav-item">
                        <button id="theme-toggle" class="btn btn-link nav-link fw-light" onclick="toggleTheme()" aria-label="Toggle theme">
                            <i class="bi bi-moon-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!-- Register Container -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus fs-1 text-primary"></i>
                        <h2 class="mt-3">Register</h2>
                        <p class="text-muted">Create your account</p>
                    </div>

                    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                    <div id="success-message" class="alert alert-success d-none" role="alert"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="fullName" name="fullName" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-at"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required minlength="3" autocomplete="username">
                            </div>
                            <small class="form-text text-muted">At least 3 characters</small>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required minlength="6" autocomplete="new-password">
                            </div>
                            <small class="form-text text-muted">At least 6 characters</small>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3" id="registerButton">
                            <i class="bi bi-person-plus me-2"></i>
                            Register
                        </button>

                        <div class="text-center">
                            <p class="mb-0">Already have an account? <a href="/login">Login here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/theme.js"></script>
<script>
    const registerForm = document.getElementById('registerForm');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');
    const registerButton = document.getElementById('registerButton');

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous messages
        errorMessage.classList.add('d-none');
        successMessage.classList.add('d-none');

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Check if passwords match
        if (password !== confirmPassword) {
            errorMessage.textContent = 'Passwords do not match';
            errorMessage.classList.remove('d-none');
            return;
        }

        // Disable button
        registerButton.disabled = true;
        registerButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registering...';

        const formData = {
            fullName: document.getElementById('fullName').value,
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: password
        };

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            const data = await response.json();

            if (response.ok) {
                // Success
                successMessage.textContent = 'Registration successful! Redirecting...';
                successMessage.classList.remove('d-none');

                // Redirect to home page after a short delay
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                // Error
                errorMessage.textContent = data.error || 'Registration failed. Please try again.';
                errorMessage.classList.remove('d-none');

                // Re-enable button
                registerButton.disabled = false;
                registerButton.innerHTML = '<i class="bi bi-person-plus me-2"></i>Register';
            }
        } catch (error) {
            console.error('Registration error:', error);
            errorMessage.textContent = 'An error occurred. Please try again.';
            errorMessage.classList.remove('d-none');

            // Re-enable button
            registerButton.disabled = false;
            registerButton.innerHTML = '<i class="bi bi-person-plus me-2"></i>Register';
        }
    });
</script>
</body>
</html>
