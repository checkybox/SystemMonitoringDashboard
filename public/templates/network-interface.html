<div class="mb-4 pb-3 border-bottom">
    <h6 class="fw-bold mb-3">
        <i class="bi bi-ethernet me-2"></i>{{interfaceName}}
    </h6>
    <div class="row">
        <div class="col-12 col-md-6">
            <div class="metric-row">
                <span class="metric-label">
                    <i class="bi bi-download metric-icon"></i>
                    Download
                </span>
                <span class="metric-value">{{rxSpeed}}</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">
                    <i class="bi bi-arrow-down-circle metric-icon"></i>
                    Total RX
                </span>
                <span class="metric-value">{{rxBytes}}</span>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="metric-row">
                <span class="metric-label">
                    <i class="bi bi-upload metric-icon"></i>
                    Upload
                </span>
                <span class="metric-value">{{txSpeed}}</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">
                    <i class="bi bi-arrow-up-circle metric-icon"></i>
                    Total TX
                </span>
                <span class="metric-value">{{txBytes}}</span>
            </div>
        </div>
    </div>
</div>
