<div class="col-12 col-md-6 col-lg-4">
    <div class="card-floating h-100">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h5 class="card-header-custom mb-0">
                <i class="bi bi-pc-display me-2"></i>
                {{identifier}}
            </h5>
            {{statusBadge}}
        </div>

        <div class="metric-row">
            <span class="metric-label">
                <i class="bi bi-pc-display-horizontal metric-icon"></i>
                OS
            </span>
            <span class="metric-value">{{os_type}}</span>
        </div>

        <div class="metric-row">
            <span class="metric-label">
                <i class="bi bi-gear-fill metric-icon"></i>
                Kernel
            </span>
            <span class="metric-value">{{release}}</span>
        </div>

        <div class="metric-row">
            <span class="metric-label">
                <i class="bi bi-cpu metric-icon"></i>
                CPU
            </span>
            <span class="metric-value">{{cpuModel}}</span>
        </div>

        <div class="metric-row">
            <span class="metric-label">
                <i class="bi bi-memory metric-icon"></i>
                Memory
            </span>
            <span class="metric-value">{{memoryGB}} GB</span>
        </div>

        <div class="metric-row">
            <span class="metric-label">
                <i class="bi bi-clock-history metric-icon"></i>
                Last Seen
            </span>
            <span class="metric-value">{{lastSeen}}</span>
        </div>

        <div class="metric-row">
            <span class="metric-label">
                <i class="bi bi-bar-chart metric-icon"></i>
                Metrics Stored
            </span>
            <span class="metric-value">{{metricsCount}}</span>
        </div>

        <div class="mt-3 d-flex gap-2">
            <button class="btn btn-sm btn-primary" onclick="viewMetrics('{{serverId}}')">
                <i class="bi bi-graph-up me-1"></i>
                View Metrics
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="openEditModal('{{serverId}}')">
                <i class="bi bi-pencil me-1"></i>
                Edit
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteMachine('{{serverId}}', '{{identifier}}')">
                <i class="bi bi-trash me-1"></i>
                Delete
            </button>
        </div>
    </div>
</div>
